<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solitaire</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div id="game-container">
        <h1>Solitaire</h1>
        
        <div id="foundations">
            <!-- Foundation piles (home piles for suits) -->
            {% for suit in ['hearts', 'diamonds', 'clubs', 'spades'] %}
                <div class="foundation-pile" id="foundation-{{ suit }}">
                    <h3>{{ suit.capitalize() }}</h3>
                    <div class="pile"></div>
                </div>
            {% endfor %}
        </div>

        <div id="tableau">
            <!-- Tableau piles (main playing area) -->
            {% for i in range(7) %}
                <div class="tableau-pile" id="tableau-pile-{{ i }}" ondrop="drop(event)" ondragover="allowDrop(event)">
                    <h3>Pile {{ i + 1 }}</h3>
                    <div class="pile">
                        {% for card in game_state['tableau'][i] %}
                            <div class="card" id="card-{{ card['rank'] }}-{{ card['suit'] }}" draggable="true" ondragstart="drag(event)" data-suit="{{ card['suit'] }}" data-rank="{{ card['rank'] }}">
                                <!-- Correct image path for card faces -->
                                <img src="{{ url_for('static', filename='images/card_fronts/' + card['suit'] + card['rank'] + '.jpg') }}" alt="{{ card['rank'] }} of {{ card['suit'] }}">
                            </div>
                        {% endfor %}
                    </div>
                </div>
            {% endfor %}
        </div>

        <div id="stock">
            <!-- Stock pile -->
            <h3>Stock</h3>
            <div class="pile" id="stock-pile">
                <!-- Correct image path for card back -->
                <img src="{{ url_for('static', filename='images/card_backs/back2.jpg') }}" alt="Stock" class="card-back">
            </div>
        </div>

        <button id="new-game-btn">New Game</button>
    </div>

    <script src="{{ url_for('static', filename='js/game.js') }}"></script>
</body>
</html>
